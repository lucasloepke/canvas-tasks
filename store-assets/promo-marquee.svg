<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <!-- Chrome Web Store marquee promo tile, 1400x560 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d8ad3"/>
      <stop offset="1" stop-color="#02588a"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M49 63l14 15 39-46" fill="none" stroke="#000" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#01304d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)"/>

